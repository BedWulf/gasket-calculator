name: Build Windows EXE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and PyInstaller
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Validate geometry calculations
        run: python -m unittest discover -s tests -v
      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean gasket.spec
      - name: Attach executable
        uses: actions/upload-artifact@v4
        with:
          name: GasketCalculator-Windows
          path: dist/GasketCalculator.exe
          if-no-files-found: error
